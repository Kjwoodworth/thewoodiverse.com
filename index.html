<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kevin James Woodworth | Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
/* ---------- GLOBAL ---------- */
*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Raleway', sans-serif;
  background: #0a0a0a;
  color: #f0ece0;
  min-height: 100vh;
}

html { scroll-behavior: smooth; }

/* ---------- GRAIN OVERLAY ---------- */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9999;
  opacity: 0.5;
}

/* ---------- HEADER / HERO ---------- */
header {
  background: #0a0a0a;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  position: relative;
  padding: 60px 20px;
  overflow: hidden;
}

header::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 50% 100%, rgba(212,175,55,0.08) 0%, transparent 70%),
    radial-gradient(ellipse 40% 40% at 20% 20%, rgba(212,175,55,0.04) 0%, transparent 60%);
  pointer-events: none;
}

.hero-eyebrow {
  font-size: 11px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: #d4c078;
  margin-bottom: 24px;
  font-weight: 500;
}

header h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(38px, 6vw, 72px);
  font-weight: 400;
  margin: 0 0 8px;
  background: linear-gradient(135deg, #FFD700 0%, #E1C699 40%, #F5C518 70%, #c9a84c 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1.1;
  letter-spacing: -1px;
}

.hero-subtitle {
  font-size: 13px;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: #c0aa6a;
  margin: 16px 0 60px;
  font-weight: 400;
}

/* ---------- HERO NAV ---------- */
.header-nav {
  display: flex;
  gap: 0;
  border: 1px solid rgba(212,175,55,0.2);
  border-radius: 2px;
  overflow: hidden;
}

.header-nav a {
  text-decoration: none;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #d4c078;
  padding: 14px 24px;
  border-right: 1px solid rgba(212,175,55,0.15);
  transition: all 0.3s ease;
  position: relative;
}

.header-nav a:last-child { border-right: none; }

.header-nav a::after {
  content: "";
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, #FFD700, #E1C699);
  transform: scaleX(0);
  transition: transform 0.3s ease;
}

.header-nav a:hover {
  color: #FFD700;
  background: rgba(212,175,55,0.05);
}

.header-nav a:hover::after { transform: scaleX(1); }

/* ---------- DECORATIVE LINE ---------- */
.hero-line {
  width: 1px;
  height: 80px;
  background: linear-gradient(to bottom, transparent, rgba(212,175,55,0.4), transparent);
  margin: 50px auto 0;
}

/* ---------- HAMBURGER ---------- */
.hamburger {
  position: absolute;
  left: 28px;
  top: 28px;
  font-size: 22px;
  cursor: pointer;
  color: #d4c078;
  z-index: 3000;
  transition: color 0.2s;
  background: none;
  border: none;
  padding: 4px;
}

.hamburger:hover { color: #FFD700; }

/* ---------- SIDE MENU ---------- */
.side-menu {
  position: fixed;
  top: 0;
  left: -320px;
  width: 280px;
  height: 100%;
  background: #0d0d0d;
  border-right: 1px solid rgba(212,175,55,0.15);
  padding: 90px 36px;
  transition: left 0.35s cubic-bezier(0.4,0,0.2,1);
  z-index: 2500;
}

.side-menu.open { left: 0; }

.side-menu a {
  display: block;
  margin-bottom: 24px;
  font-size: 12px;
  letter-spacing: 4px;
  text-transform: uppercase;
  text-decoration: none;
  color: #c0aa6a;
  font-weight: 600;
  transition: color 0.2s;
}

.side-menu a:hover { color: #FFD700; }

/* ---------- MOBILE ---------- */
@media (max-width: 768px) {
  .header-nav { display: none; }
}
</style>
</head>
<body>

<!-- SIDE MENU -->
<div class="side-menu" id="sideMenu">
  <a href="index.html" onclick="toggleMenu()">Home</a>
  <a href="about.html" onclick="toggleMenu()">About</a>
  <a href="portfolio.html" onclick="toggleMenu()">Portfolio</a>
  <a href="media.html" onclick="toggleMenu()">Media</a>
  <a href="wo.html" onclick="toggleMenu()">WO</a>
  <a href="contact.html" onclick="toggleMenu()">Contact</a>
</div>

<!-- HEADER / HERO -->
<header id="home">
  <button class="hamburger" onclick="toggleMenu()" aria-label="Menu">☰</button>

  <p class="hero-eyebrow">Professional Online Portfolio</p>
  <h1>Kevin James Woodworth</h1>
  <p class="hero-subtitle">Communications & Media Relations Professional</p>

  <nav class="header-nav">
    <a href="about.html">About</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="media.html">Media</a>
    <a href="wo.html">WO</a>
    <a href="contact.html">Contact</a>
  </nav>

  <div class="hero-line"></div>
</header>

<script>
function toggleMenu() {
  document.getElementById("sideMenu").classList.toggle("open");
}
</script>
</body>
</html>
